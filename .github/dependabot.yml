version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Expo fija una matriz compatible de React Native y módulos nativos. Los saltos mayores se
    # planifican juntos en un sprint técnico y siempre se validan con un APK en dispositivo.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
